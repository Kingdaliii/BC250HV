name: CachyOS BC-250 Stable Module Build

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.find.outputs.version }}
      url: ${{ steps.find.outputs.url }}
      sha256: ${{ steps.find.outputs.sha256 }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - id: find
        name: Find latest Stable BC-250 headers
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, os

          url = "https://api.github.com/repos/MastaG/linux-cachyos-bc250/releases/tags/repo"
          req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json"})
          with urllib.request.urlopen(req) as response:
              release = json.load(response)

          pattern = re.compile(r"^linux-cachyos-bc250-headers-(\d+\.\d+\.\d+-\d+\.\d+)-x86_64\.pkg\.tar\.zst$")
          matches = []

          for asset in release["assets"]:
              match = pattern.fullmatch(asset["name"])
              digest = asset.get("digest", "")
              if match and re.fullmatch(r"sha256:[a-f0-9]{64}", digest):
                  version = match.group(1)
                  numbers = tuple(map(int, re.findall(r"\d+", version)))
                  matches.append((numbers, version, asset["browser_download_url"], digest[7:]))

          if not matches:
              raise SystemExit("No Stable BC-250 headers package with SHA-256 found")

          _, version, download_url, sha256 = max(matches)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("version=" + version + chr(10))
              output.write("url=" + download_url + chr(10))
              output.write("sha256=" + sha256 + chr(10))
          PY

      - id: check
        name: Check whether this version is already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="cachyos-bc250-${{ steps.find.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version already published: $TAG"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: discover
    if: needs.discover.outputs.exists == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KERNEL_VERSION: ${{ needs.discover.outputs.version }}-cachyos-bc250
      HEADERS_URL: ${{ needs.discover.outputs.url }}
      HEADERS_SHA256: ${{ needs.discover.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Build module in Arch Linux container
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --security-opt=no-new-privileges             --env KERNEL_VERSION             --env HEADERS_URL             --env HEADERS_SHA256             --volume "$GITHUB_WORKSPACE:/work"             --workdir /work             archlinux:base             bash .github/scripts/issue-kernel-arch.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bc250-stable-module
          path: out/*
          if-no-files-found: error

  release:
    needs: [discover, build]
    if: needs.discover.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bc250-stable-module
          path: out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cachyos-bc250-${{ needs.discover.outputs.version }}
          name: CachyOS BC-250 Stable ${{ needs.discover.outputs.version }}
          body: |
            Automatically built kernel module for CachyOS BC-250 Stable.

            Kernel: ${{ needs.discover.outputs.version }}-cachyos-bc250

            Compilation and vermagic checked.
            Runtime loading has not been tested.
            The module is unsigned and requires AMD SVM.
          files: out/*
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
